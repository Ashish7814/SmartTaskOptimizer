name: SmartTaskOptimizer CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: 'SmartTaskOptimizer.sln'
  API_PROJECT: 'SmartTaskOptimizer.API/SmartTaskOptimizer.API.csproj'
  INFRA_PROJECT: 'SmartTaskOptimizer.Infrastructure/SmartTaskOptimizer.Infrastructure.csproj'

jobs:
  build-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SOLUTION }}" --configuration Release --no-build

      - name: Publish
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    name: Deploy to MonsterASP
    needs: build-test
    if: github.ref == 'refs/heads/master'

    runs-on: windows-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      - name: Database Migration
        env:
          CONNECTION_STRING: ${{ secrets.MONSTERASP_CONNECTION_STRING }}
        run: |
          dotnet tool install --global dotnet-ef --version 8.*

          dotnet ef database update `
            --project "${{ env.INFRA_PROJECT }}" `
            --startup-project "${{ env.API_PROJECT }}" `
            --configuration Release `
            --connection "$env:CONNECTION_STRING"
