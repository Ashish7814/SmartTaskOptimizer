name: CI-CD - SmartTaskOptimizer

"on":
  push:
    branches:
      - master
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarttask-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_RUNTIME: "win-x86"
  SOLUTION_FILE: "SmartTaskOptimizer.sln"
  API_PROJECT: "SmartTaskOptimizer.API/SmartTaskOptimizer.API.csproj"
  PUBLISH_DIRECTORY: "${{ github.workspace }}/publish"
  ARTIFACT_NAME: "SmartTaskOptimizer-api"

jobs:

  # ============================================================
  # BUILD, TEST AND PUBLISH
  # ============================================================

  build-test:
    name: Build, Test and Publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # SETUP .NET 8
      # --------------------------------------------------------

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --------------------------------------------------------
      # FORCE .NET 8 SDK
      # --------------------------------------------------------

      - name: Configure .NET 8 SDK
        shell: pwsh
        run: |
          $sdkOutput = dotnet --list-sdks |
            Select-String '^8\.0\.' |
            Select-Object -Last 1

          if (-not $sdkOutput) {
            throw "No .NET 8 SDK was found."
          }

          $sdkVersion = ($sdkOutput.ToString().Trim() -split '\s+')[0]

          Write-Host "Selected .NET 8 SDK: $sdkVersion"

          $globalJson = @{
            sdk = @{
              version = $sdkVersion
              rollForward = "latestPatch"
              allowPrerelease = $false
            }
          } | ConvertTo-Json -Depth 3

          $globalJson | Set-Content `
            -Path "global.json" `
            -Encoding UTF8

          Write-Host "Created global.json:"
          Get-Content "global.json"

      # --------------------------------------------------------
      # VERIFY .NET SDK
      # --------------------------------------------------------

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          $version = dotnet --version

          Write-Host "Active .NET SDK: $version"

          if (-not $version.StartsWith("8.")) {
            throw "Expected .NET 8 SDK but found $version"
          }

          Write-Host ".NET 8 SDK is active."

      # --------------------------------------------------------
      # DISPLAY .NET INFORMATION
      # --------------------------------------------------------

      - name: Display .NET information
        shell: pwsh
        run: |
          dotnet --info

      # --------------------------------------------------------
      # VALIDATE PROJECT STRUCTURE
      # --------------------------------------------------------

      - name: Validate project structure
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.SOLUTION_FILE }}")) {
            throw "Solution file not found: ${{ env.SOLUTION_FILE }}"
          }

          if (-not (Test-Path "${{ env.API_PROJECT }}")) {
            throw "API project not found: ${{ env.API_PROJECT }}"
          }

          Write-Host "Solution found:"
          Write-Host "${{ env.SOLUTION_FILE }}"

          Write-Host ""
          Write-Host "API project found:"
          Write-Host "${{ env.API_PROJECT }}"

      # --------------------------------------------------------
      # NUGET CACHE
      # --------------------------------------------------------

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --------------------------------------------------------
      # RESTORE
      #
      # Runtime is specified here so the API project has
      # net8.0/win-x86 assets available for publishing.
      # --------------------------------------------------------

      - name: Restore dependencies
        run: >
          dotnet restore "${{ env.SOLUTION_FILE }}"
          --runtime "${{ env.DOTNET_RUNTIME }}"
          --force

      # --------------------------------------------------------
      # BUILD
      #
      # IMPORTANT:
      # Do NOT specify --runtime when building the solution.
      # This avoids NETSDK1134.
      # --------------------------------------------------------

      - name: Build Release
        run: >
          dotnet build "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-restore
          --nologo

      # --------------------------------------------------------
      # TEST
      # --------------------------------------------------------

      - name: Run automated tests
        run: >
          dotnet test "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults"
          --collect:"XPlat Code Coverage"
          --verbosity normal

      # --------------------------------------------------------
      # TEST RESULTS
      # --------------------------------------------------------

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: "${{ github.workspace }}/TestResults/**/*.trx"
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------------
      # CODE COVERAGE
      # --------------------------------------------------------

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: "${{ github.workspace }}/TestResults/**/coverage.*"
          if-no-files-found: ignore
          retention-days: 14

      # --------------------------------------------------------
      # PUBLISH API
      #
      # Runtime is allowed here because this is an individual
      # project publish rather than a solution build.
      # --------------------------------------------------------

      - name: Publish production application
        run: >
          dotnet publish "${{ env.API_PROJECT }}"
          --configuration Release
          --no-restore
          --output "${{ env.PUBLISH_DIRECTORY }}"
          --runtime "${{ env.DOTNET_RUNTIME }}"
          --self-contained false
          --nologo

      # --------------------------------------------------------
      # VALIDATE PUBLISH OUTPUT
      # --------------------------------------------------------

      - name: Validate publish output
        shell: pwsh
        run: |
          $publish = "${{ env.PUBLISH_DIRECTORY }}"

          if (-not (Test-Path $publish)) {
            throw "Publish directory was not created."
          }

          $apiDll = Join-Path $publish "SmartTaskOptimizer.API.dll"
          $webConfig = Join-Path $publish "web.config"

          if (-not (Test-Path $apiDll)) {
            throw "SmartTaskOptimizer.API.dll was not found."
          }

          if (-not (Test-Path $webConfig)) {
            throw "web.config was not found."
          }

          Write-Host "API DLL found."
          Write-Host "web.config found."

          $secretFiles = Get-ChildItem `
            -Path $publish `
            -Recurse `
            -Force `
            -Include "*.pfx", "*.pem", "*.key", ".env" `
            -ErrorAction SilentlyContinue

          if ($secretFiles) {
            Write-Host "Potential sensitive files detected."

            $secretFiles | ForEach-Object {
              Write-Host $_.FullName
            }

            throw "Sensitive certificate/key/environment files were found."
          }

          Write-Host "Publish output validation successful."

      # --------------------------------------------------------
      # CREATE DEPLOYMENT ZIP
      # --------------------------------------------------------

      - name: Create deployment artifact
        shell: pwsh
        run: |
          $artifactPath = "${{ github.workspace }}/${{ env.ARTIFACT_NAME }}-${{ github.sha }}.zip"

          Compress-Archive `
            -Path "${{ env.PUBLISH_DIRECTORY }}/*" `
            -DestinationPath $artifactPath `
            -Force

          if (-not (Test-Path $artifactPath)) {
            throw "Deployment artifact was not created."
          }

          Write-Host "Deployment artifact created successfully."

      # --------------------------------------------------------
      # UPLOAD DEPLOYMENT ARTIFACT
      # --------------------------------------------------------

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          path: "${{ github.workspace }}/${{ env.ARTIFACT_NAME }}-${{ github.sha }}.zip"
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # DEPLOY TO MONSTERASP.NET
  # ============================================================

  deploy-production:
    name: Deploy to MonsterASP.NET
    needs: build-test

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master'
        )
      )

    runs-on: windows-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # DOWNLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          path: ./deployment

      # --------------------------------------------------------
      # EXTRACT DEPLOYMENT PACKAGE
      # --------------------------------------------------------

      - name: Extract deployment package
        shell: pwsh
        run: |
          $zipFile = "${{ github.workspace }}/deployment/${{ env.ARTIFACT_NAME }}-${{ github.sha }}.zip"
          $publish = "${{ github.workspace }}/publish"

          if (-not (Test-Path $zipFile)) {
            throw "Deployment ZIP was not found: $zipFile"
          }

          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publish `
            -Force | Out-Null

          Expand-Archive `
            -Path $zipFile `
            -DestinationPath $publish `
            -Force

          if (-not (Test-Path "$publish/SmartTaskOptimizer.API.dll")) {
            throw "SmartTaskOptimizer.API.dll was not found."
          }

          if (-not (Test-Path "$publish/web.config")) {
            throw "web.config was not found."
          }

          Write-Host "Deployment package extracted successfully."

      # --------------------------------------------------------
      # DEPLOY USING MONSTERASP.NET WEBDEPLOY
      #
      # MonsterASP.NET officially documents these four secrets:
      # WEBSITE_NAME
      # SERVER_COMPUTER_NAME
      # SERVER_USERNAME
      # SERVER_PASSWORD
      # --------------------------------------------------------

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      # --------------------------------------------------------
      # WAIT FOR APPLICATION STARTUP
      # --------------------------------------------------------

      - name: Wait for application startup
        shell: pwsh
        run: |
          Write-Host "Waiting for MonsterASP.NET application startup..."
          Start-Sleep -Seconds 20

      # --------------------------------------------------------
      # HEALTH CHECK
      # --------------------------------------------------------

      - name: Verify production health
        shell: pwsh
        env:
          MONSTERASP_HEALTHCHECK_URL: ${{ secrets.MONSTERASP_HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MONSTERASP_HEALTHCHECK_URL)) {
            throw "MONSTERASP_HEALTHCHECK_URL is not configured."
          }

          Write-Host "Checking production health endpoint..."

          for ($attempt = 1; $attempt -le 6; $attempt++) {

            try {

              $response = Invoke-WebRequest `
                -Uri $env:MONSTERASP_HEALTHCHECK_URL `
                -UseBasicParsing `
                -TimeoutSec 20 `
                -ErrorAction Stop

              Write-Host "Health check attempt $attempt returned HTTP $($response.StatusCode)"

              if ($response.StatusCode -eq 200) {
                Write-Host "Production health check passed."
                exit 0
              }

            }
            catch {

              Write-Host "Health check attempt $attempt failed."
              Write-Host $_.Exception.Message

            }

            if ($attempt -lt 6) {
              Write-Host "Waiting 10 seconds before retry..."
              Start-Sleep -Seconds 10
            }
          }

          throw "Production health check failed after 6 attempts."

      # --------------------------------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------------------------------

      - name: Deployment summary
        if: success()
        shell: pwsh
        env:
          MONSTERASP_HEALTHCHECK_URL: ${{ secrets.MONSTERASP_HEALTHCHECK_URL }}
        run: |
          Write-Host "============================================"
          Write-Host "SmartTaskOptimizer deployment successful"
          Write-Host "============================================"
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Environment: production"
          Write-Host "Health check: $env:MONSTERASP_HEALTHCHECK_URL"
          Write-Host "============================================"
